<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecamotor | Taller Mecánico del Futuro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tarjeta-taller">
        <div class="logo">🛠️ MECAMOTOR</div>
        <h1>Servicio Técnico Especializado</h1>
        <p>Potencia, precisión y tecnología robótica avanzada para tu motocicleta.</p>
        
        <!-- Aquí metemos los dos botones ordenados dentro de su contenedor -->
        <div class="botones-container">
            <button id="boton-diagnostico">Escanear Moto</button>
            <a href="https://wa.me" target="_blank" class="btn-whatsapp">
                💬 Agendar por WhatsApp
            </a>
        </div>
        
        <!-- Consola de diagnóstico -->
        <div id="consola-diagnostico" class="consola oculto">
            <p class="analizando">🤖 Iniciando escáner cyber-mecánico...</p>
            <p id="resultado-scanner"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
